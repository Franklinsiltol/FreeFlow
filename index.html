<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beemote IA</title>
    <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.0"></script>
    <style>
        :root {
            --primary-color: #6e48aa;
            --primary-dark: #4b2d7f;
            --secondary-color: #9d50bb;
            --background-dark: #1a1a2e;
            --background-darker: #16213e;
            --text-color: #e6e6e6;
            --text-light: #ffffff;
            --user-message: #4b2d7f;
            --ai-message: #16213e;
            --sidebar-width: 250px;
            --mobile-breakpoint: 768px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-dark);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--background-darker);
            height: 100vh;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-light);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-title span {
            color: var(--secondary-color);
        }

        .sidebar-menu {
            list-style: none;
            margin-top: 20px;
        }

        .sidebar-menu li {
            margin-bottom: 10px;
        }

        .sidebar-menu button {
            width: 100%;
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: var(--text-color);
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        .sidebar-menu button:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .sidebar-menu button.active {
            background-color: var(--primary-dark);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px;
            margin-top: 20px;
        }

        .history-item {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background-color 0.2s;
        }

        .history-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .history-item.active {
            background-color: var(--primary-dark);
        }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        .chat-header {
            padding: 15px 20px;
            background-color: var(--background-darker);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
            display: none;
        }

        .chat-title {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-message);
            color: var(--text-light);
            border-bottom-right-radius: 5px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--ai-message);
            border-bottom-left-radius: 5px;
        }

        .chat-input-container {
            padding: 15px 20px;
            background-color: var(--background-darker);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-form {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 25px;
            border: none;
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            outline: none;
            font-size: 1rem;
        }

        .chat-input:focus {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .send-button {
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .send-button:hover {
            background-color: var(--primary-dark);
        }

        .send-button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .typing-indicator {
            padding: 12px 16px;
            background-color: var(--ai-message);
            border-radius: 18px;
            border-bottom-left-radius: 5px;
            align-self: flex-start;
            display: inline-flex;
            gap: 5px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-color);
            border-radius: 50%;
            animation: typingAnimation 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingAnimation {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-5px);
            }
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                z-index: 100;
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .menu-toggle {
                display: block;
            }

            .message {
                max-width: 90%;
            }
        }

        /* Loading Animation */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            gap: 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: var(--text-color);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1 class="sidebar-title">Beemote<span>IA</span></h1>
        </div>
        <ul class="sidebar-menu">
            <li>
                <button id="new-chat-btn">
                    <span>✏️</span> Novo Chat
                </button>
            </li>
            <li>
                <button id="history-btn" class="active">
                    <span>🕒</span> Histórico
                </button>
            </li>
            <li>
                <button id="export-btn">
                    <span>📥</span> Exportar Histórico
                </button>
            </li>
            <li>
                <button id="settings-btn">
                    <span>⚙️</span> Configurações
                </button>
            </li>
        </ul>
        <div class="history-list" id="history-list">
            <!-- History items will be added here dynamically -->
        </div>
    </div>

    <div class="main-content">
        <div class="chat-header">
            <button class="menu-toggle" id="menu-toggle">☰</button>
            <div class="chat-title">Novo Chat</div>
            <div style="width: 40px;"></div> <!-- Spacer for alignment -->
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- Messages will be added here dynamically -->
        </div>
        <div class="chat-input-container">
            <form class="chat-form" id="chat-form">
                <input type="text" class="chat-input" id="chat-input" placeholder="Digite sua mensagem..." autocomplete="off">
                <button type="submit" class="send-button" id="send-button">Enviar</button>
            </form>
        </div>
    </div>

    <div class="loading-container" id="loading-container">
        <div class="loading-spinner"></div>
        <div class="loading-text">Carregando modelo de IA...</div>
    </div>

    <script type="module">
        // Database setup
        const DB_NAME = 'BeemoteIADB';
        const DB_VERSION = 1;
        const STORE_NAME = 'chats';
        let db;
        let currentChatId = null;
        let currentChatTitle = 'Novo Chat';
        let pipeline;

        // DOM elements
        const sidebar = document.querySelector('.sidebar');
        const menuToggle = document.getElementById('menu-toggle');
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const sendButton = document.getElementById('send-button');
        const newChatBtn = document.getElementById('new-chat-btn');
        const historyBtn = document.getElementById('history-btn');
        const exportBtn = document.getElementById('export-btn');
        const historyList = document.getElementById('history-list');
        const loadingContainer = document.getElementById('loading-container');
        const chatTitle = document.querySelector('.chat-title');

        // Initialize the app
        async function initApp() {
            await initDB();
            await loadModel();
            loadChatHistory();
            setupEventListeners();
        }

        // Initialize IndexedDB
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                
                request.onsuccess = (event) => {
                    db = event.target.result;
                    resolve();
                };
                
                request.onerror = (event) => {
                    console.error('Error opening database:', event.target.error);
                    reject(event.target.error);
                };
            });
        }

        // Load the AI model
        async function loadModel() {
            try {
                pipeline = await transformers.pipeline(
                    'text-generation',
                    'Xenova/phi-1_5',
                    {
                        progress_callback: (progress) => {
                            if (progress.status === 'ready') {
                                loadingContainer.style.display = 'none';
                            }
                        }
                    }
                );
            } catch (error) {
                console.error('Error loading model:', error);
                loadingContainer.querySelector('.loading-text').textContent = 'Erro ao carregar o modelo. Recarregue a página.';
            }
        }

        // Load chat history from DB
        function loadChatHistory() {
            const transaction = db.transaction(STORE_NAME, 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.getAll();
            
            request.onsuccess = (event) => {
                const chats = event.target.result;
                historyList.innerHTML = '';
                
                if (chats.length === 0) {
                    const emptyMsg = document.createElement('div');
                    emptyMsg.textContent = 'Nenhum histórico encontrado';
                    emptyMsg.style.padding = '20px';
                    emptyMsg.style.color = '#999';
                    historyList.appendChild(emptyMsg);
                    return;
                }
                
                chats.sort((a, b) => b.timestamp - a.timestamp).forEach(chat => {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'history-item';
                    historyItem.textContent = chat.title || `Chat ${new Date(chat.timestamp).toLocaleString()}`;
                    historyItem.dataset.chatId = chat.id;
                    
                    historyItem.addEventListener('click', () => {
                        loadChat(chat.id);
                    });
                    
                    historyList.appendChild(historyItem);
                });
            };
            
            request.onerror = (event) => {
                console.error('Error loading chat history:', event.target.error);
            };
        }

        // Create a new chat
        function createNewChat() {
            currentChatId = Date.now().toString();
            currentChatTitle = 'Novo Chat';
            chatTitle.textContent = currentChatTitle;
            chatMessages.innerHTML = '';
            chatInput.focus();
        }

        // Load a specific chat
        function loadChat(chatId) {
            const transaction = db.transaction(STORE_NAME, 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.get(chatId);
            
            request.onsuccess = (event) => {
                const chat = event.target.result;
                if (chat) {
                    currentChatId = chat.id;
                    currentChatTitle = chat.title || `Chat ${new Date(chat.timestamp).toLocaleString()}`;
                    chatTitle.textContent = currentChatTitle;
                    
                    // Clear current messages
                    chatMessages.innerHTML = '';
                    
                    // Add messages to the chat
                    chat.messages.forEach(msg => {
                        addMessageToChat(msg.role, msg.content);
                    });
                    
                    // Update active state in history list
                    document.querySelectorAll('.history-item').forEach(item => {
                        item.classList.remove('active');
                        if (item.dataset.chatId === chatId) {
                            item.classList.add('active');
                        }
                    });
                    
                    // Scroll to bottom
                    setTimeout(() => {
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }, 100);
                }
            };
            
            request.onerror = (event) => {
                console.error('Error loading chat:', event.target.error);
            };
        }

        // Save a message to the current chat
        function saveMessage(role, content) {
            if (!currentChatId) {
                currentChatId = Date.now().toString();
            }
            
            const transaction = db.transaction(STORE_NAME, 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            
            // First, try to get the existing chat
            const getRequest = store.get(currentChatId);
            
            getRequest.onsuccess = (event) => {
                const chat = event.target.result || {
                    id: currentChatId,
                    timestamp: Date.now(),
                    messages: [],
                    title: currentChatTitle
                };
                
                // Add the new message
                chat.messages.push({ role, content });
                
                // If this is the first user message, set the title
                if (role === 'user' && chat.messages.length === 1) {
                    const shortMessage = content.length > 30 ? content.substring(0, 30) + '...' : content;
                    chat.title = shortMessage;
                    currentChatTitle = shortMessage;
                    chatTitle.textContent = currentChatTitle;
                }
                
                // Put the updated chat back in the store
                store.put(chat);
                
                // Update the history list if this is a new chat
                if (!event.target.result) {
                    loadChatHistory();
                }
            };
            
            getRequest.onerror = (event) => {
                console.error('Error saving message:', event.target.error);
            };
        }

        // Add a message to the chat UI
        function addMessageToChat(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}-message`;
            messageDiv.textContent = content;
            chatMessages.appendChild(messageDiv);
            
            // Scroll to the new message
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Show typing indicator
        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typing-indicator';
            
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = 'typing-dot';
                typingDiv.appendChild(dot);
            }
            
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Hide typing indicator
        function hideTypingIndicator() {
            const typingIndicator = document.getElementById('typing-indicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // Generate AI response
        async function generateAIResponse(prompt) {
            if (!pipeline) {
                console.error('Model not loaded yet');
                return "Desculpe, o modelo ainda não foi carregado. Por favor, tente novamente em alguns segundos.";
            }
            
            try {
                showTypingIndicator();
                
                const response = await pipeline(prompt, {
                    max_new_tokens: 200,
                    temperature: 0.7,
                    do_sample: true
                });
                
                hideTypingIndicator();
                return response[0].generated_text;
            } catch (error) {
                console.error('Error generating response:', error);
                hideTypingIndicator();
                return "Desculpe, ocorreu um erro ao gerar a resposta. Por favor, tente novamente.";
            }
        }

        // Export chat history
        function exportChatHistory() {
            const transaction = db.transaction(STORE_NAME, 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.getAll();
            
            request.onsuccess = (event) => {
                const chats = event.target.result;
                if (chats.length === 0) {
                    alert('Nenhum histórico para exportar.');
                    return;
                }
                
                let exportText = '';
                
                chats.sort((a, b) => a.timestamp - b.timestamp).forEach(chat => {
                    exportText += `=== Chat: ${chat.title || new Date(chat.timestamp).toLocaleString()} ===\n\n`;
                    
                    chat.messages.forEach(msg => {
                        const prefix = msg.role === 'user' ? 'Você: ' : 'Beemote IA: ';
                        exportText += `${prefix}${msg.content}\n\n`;
                    });
                    
                    exportText += '\n';
                });
                
                // Create download link
                const blob = new Blob([exportText], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `beemote_ia_historico_${new Date().toISOString().split('T')[0]}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };
            
            request.onerror = (event) => {
                console.error('Error exporting chat history:', event.target.error);
                alert('Erro ao exportar o histórico.');
            };
        }

        // Setup event listeners
        function setupEventListeners() {
            // Toggle sidebar on mobile
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
            });

            // New chat button
            newChatBtn.addEventListener('click', () => {
                createNewChat();
                if (window.innerWidth <= 768) {
                    sidebar.classList.remove('open');
                }
            });

            // History button
            historyBtn.addEventListener('click', () => {
                loadChatHistory();
            });

            // Export button
            exportBtn.addEventListener('click', () => {
                exportChatHistory();
            });

            // Chat form submission
            chatForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const message = chatInput.value.trim();
                if (!message) return;
                
                // Disable input while processing
                chatInput.disabled = true;
                sendButton.disabled = true;
                
                // Add user message to chat
                addMessageToChat('user', message);
                saveMessage('user', message);
                
                // Clear input
                chatInput.value = '';
                
                // Generate AI response
                const aiResponse = await generateAIResponse(message);
                
                // Add AI response to chat
                addMessageToChat('ai', aiResponse);
                saveMessage('ai', aiResponse);
                
                // Re-enable input
                chatInput.disabled = false;
                sendButton.disabled = false;
                chatInput.focus();
            });

            // Close sidebar when clicking outside on mobile
            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 768 && sidebar.classList.contains('open') && 
                    !sidebar.contains(e.target) && e.target !== menuToggle) {
                    sidebar.classList.remove('open');
                }
            });
        }

        // Initialize the app when the DOM is loaded
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
